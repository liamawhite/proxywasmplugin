name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Download dependencies
      run: go mod download

    - name: Build WASM plugin
      run: make build

    - name: Upload WASM artifact
      uses: actions/upload-artifact@v4
      with:
        name: plugin-wasm
        path: plugin.wasm
        retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Download dependencies
      run: go mod download

    - name: Download WASM artifact
      uses: actions/download-artifact@v4
      with:
        name: plugin-wasm
        path: .

    - name: Run integration tests
      run: make test-integration
      env:
        TESTCONTAINERS_RYUK_DISABLED: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          *.log
          test-results/
        retention-days: 7
        if-no-files-found: ignore
