name: Build and Publish

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Download dependencies
      run: go mod download

    - name: Build WASM plugin
      run: make build

    - name: Upload WASM artifact
      uses: actions/upload-artifact@v4
      with:
        name: plugin-wasm
        path: plugin.wasm
        retention-days: 7

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      matrix:
        envoy-version: ['v1.33.0', 'v1.34.0', 'v1.35.0', 'v1.36.0', 'v1.37.0']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Download dependencies
      run: go mod download

    - name: Download WASM artifact
      uses: actions/download-artifact@v4
      with:
        name: plugin-wasm
        path: .

    - name: Run integration tests (Envoy ${{ matrix.envoy-version }})
      run: make test-integration
      env:
        ENVOY_VERSION: ${{ matrix.envoy-version }}
        TESTCONTAINERS_RYUK_DISABLED: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.envoy-version }}
        path: |
          *.log
          test-results/
        retention-days: 7
        if-no-files-found: ignore

  publish:
    runs-on: ubuntu-latest
    needs: [build, test]
    # Only publish on push to main or tags, not on PRs
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download WASM artifact
      uses: actions/download-artifact@v4
      with:
        name: plugin-wasm
        path: .

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push WASM OCI image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
