name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Download dependencies
      run: go mod download

    - name: Build WASM plugin
      run: make build

    - name: Upload WASM artifact
      uses: actions/upload-artifact@v4
      with:
        name: plugin-wasm
        path: plugin.wasm
        retention-days: 7
